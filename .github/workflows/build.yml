name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/CamledianDrive/CamledianDrive.csproj

      - name: Test transfer monitoring
        run: dotnet run --project tests/CamledianDrive.TransferTests --configuration Release

      - name: Build
        run: dotnet build src/CamledianDrive/CamledianDrive.csproj --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish src/CamledianDrive/CamledianDrive.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/win-x64

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Build guarded rclone
        run: python scripts/build-rclone.py

      - name: Test real rclone writeback
        run: python tests/rclone-writeback-smoke.py artifacts/win-x64/tools/rclone.exe

      - name: Test VFS write permissions with full cache
        run: python tests/rclone-writeback-smoke.py artifacts/win-x64/tools/rclone.exe --guard

      - name: Bundle WinFsp installer
        shell: pwsh
        run: |
          $headers = @{
            'Accept' = 'application/vnd.github+json'
            'User-Agent' = 'CamledianDrive-build'
          }
          $release = Invoke-RestMethod 'https://api.github.com/repos/winfsp/winfsp/releases/latest' -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like 'winfsp-*.msi' } | Select-Object -First 1
          if (-not $asset) { throw 'WinFsp MSI nebyl v posledním releasu nalezen.' }

          New-Item 'artifacts/win-x64/dependencies' -ItemType Directory -Force | Out-Null
          Invoke-WebRequest $asset.browser_download_url -OutFile 'artifacts/win-x64/dependencies/winfsp.msi'
          Invoke-WebRequest 'https://raw.githubusercontent.com/winfsp/winfsp/master/License.txt' -OutFile 'artifacts/win-x64/dependencies/WinFsp-LICENSE.txt'
          $release.tag_name | Out-File 'artifacts/win-x64/dependencies/WinFsp-version.txt' -Encoding utf8

      - name: Install WinFsp for actual mount test
        shell: pwsh
        run: |
          $msi = (Resolve-Path artifacts/win-x64/dependencies/winfsp.msi).Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "WinFsp install failed: $($install.ExitCode)" }

      - name: Test Windows drive create and editor save
        run: python tests/rclone-writeback-smoke.py artifacts/win-x64/tools/rclone.exe --guard --mount

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamledianDrive-win-x64
          path: artifacts/win-x64/

      - name: Compute installer version
        id: version
        shell: pwsh
        run: echo "value=1.0.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build installer
        shell: pwsh
        run: |
          iscc installer\CamledianDrive.iss `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=$(Resolve-Path artifacts\win-x64)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamledianDrive-Setup-win-x64
          path: artifacts/installer/*.exe
